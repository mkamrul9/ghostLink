services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      MAX_CLIENTS: ${MAX_CLIENTS:-10000}
      MAX_ROOM_PEERS: ${MAX_ROOM_PEERS:-6}
      TURN_URLS: '["turn:${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP}:3478?transport=udp","turn:${TURN_PUBLIC_IP}:3478?transport=tcp"]'
      TURN_SECRET: ${TURN_SECRET:?Set a random TURN_SECRET with at least 32 characters}
      TURN_TTL: 3600
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  https:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MYSTIC_DOMAIN: ${MYSTIC_DOMAIN:?Set MYSTIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  relay:
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    # Linux host networking avoids a large Docker UDP port mapping table.
    network_mode: host
    command:
      - -n
      - --pidfile=/tmp/turnserver.pid
      - --log-file=stdout
      - --simple-log
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET}
      - --realm=${MYSTIC_DOMAIN:?Set MYSTIC_DOMAIN}
      - --external-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP}
      - --listening-port=3478
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49259}
      - --user-quota=12
      - --total-quota=${TURN_TOTAL_QUOTA:-200}
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  caddy_data:
  caddy_config:
